name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        # Current LTS lines. engines is still >=18, but 18/20 are EOL
        # (Apr 2025 / Apr 2026) and no longer exercised here.
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run docs:build # fails on dead links


  # M3 (planned): version × database integration matrix.
  # Test apps pinned to prisma@5/6/7/8-rc × postgres/mysql/sqlite/mongodb,
  # plus a nightly canary job against prisma@dev to catch future breakage early.
