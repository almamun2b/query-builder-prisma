name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        # Current LTS lines. engines is still >=18, but 18/20 are EOL
        # (Apr 2025 / Apr 2026) and no longer exercised here.
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Conventional Commits enforcement (second layer; the local husky commit-msg
  # hook is the first). Catches `--no-verify` bypasses. commitlint v21 needs
  # Node >= 22, so this job pins 24.
  # Push to main validates the exact range semantic-release will analyze
  # (commits since the last v* tag); a PR validates just its own commits.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags — required for range analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.sha }}" --verbose
          else
            FROM=$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || git rev-list --max-parents=0 HEAD)
            npx commitlint --from "$FROM" --to HEAD --verbose
          fi

  # M3 (planned): version × database integration matrix.
  # Test apps pinned to prisma@5/6/7/8-rc × postgres/mysql/sqlite/mongodb,
  # plus a nightly canary job against prisma@dev to catch future breakage early.
