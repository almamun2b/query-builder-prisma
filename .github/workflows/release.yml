name: Release

# Fully automatic release pipeline (semantic-release). A push to main is
# analyzed against Conventional Commits since the last v* tag:
#
#   fix:                    → patch   (0.2.1)
#   feat:                   → minor   (0.3.0)
#   feat!:/BREAKING CHANGE: → major   (1.0.0)
#   chore:/docs:/ci:/test:  → no release ("no relevant changes")
#
# Auth to npm is TOKENLESS: npm "trusted publishing" (OIDC). The package's
# npm settings name this repo + the workflow FILE NAME `release.yml`, so do not
# rename this file without updating the trusted publisher on npmjs.com. There
# is no NPM_TOKEN secret; see CONTRIBUTING.md "One-time npm setup".
#
# On a release it stamps the version into package.json inside the runner,
# publishes to npm with provenance (prepublishOnly runs the full verify
# pipeline first), pushes the v* tag and creates the GitHub Release with
# generated notes. Nothing is committed back to main: it is protected by a
# "changes must go through a pull request" ruleset, so the latest v* tag (and
# npm) is the version source of truth; package.json on main is not bumped.
# workflow_dispatch exists to re-run a failed release; semantic-release is
# deterministic per commit range, so a re-run never double-publishes.
#
# The 1.x line is burned: 1.0.0 and 1.1.0 were each published and unpublished
# on 2026-11-01, and npm never re-allows an unpublished version string. While
# pre-1.0, .releaserc.json remaps breaking commits to minor (SemVer 0.x may
# change behavior in minors), so no release computes a 1.x version. When the
# library finally leaves 0.x, go straight to 2.0.0: push a fence tag on the
# commit BEFORE the breaking one
# (`git push origin <breaking-commit>~1:refs/tags/v1.0.0`) and re-run this
# workflow (workflow_dispatch) — the breaking change then releases 2.0.0.
# A non-breaking feat after the fence would compute 1.1.0 (burned, E400), so
# the first stable release must carry the BREAKING CHANGE.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # v* tag, GitHub Release
  id-token: write # OIDC: npm trusted publishing + provenance

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'almamun2b/query-builder-prisma'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags — required for commit analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Tool versions (trusted publishing needs npm >= 11.6.2)
        run: node --version && npm --version
      - run: npm ci
      - name: semantic-release
        # No NPM_TOKEN: @semantic-release/npm exchanges the job's OIDC token
        # for a short-lived npm publish token (trusted publisher), and the
        # provenance attestation is generated automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
