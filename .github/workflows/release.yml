name: Release

# Fully automatic release pipeline (semantic-release). A push to main is
# analyzed against Conventional Commits since the last v* tag:
#
#   fix:                    → patch   (0.2.1)
#   feat:                   → minor   (0.3.0)
#   feat!:/BREAKING CHANGE: → major   (1.0.0)
#   chore:/docs:/ci:/test:  → no release ("no relevant changes")
#
# On a release it bumps package.json, publishes to npm with provenance
# (prepublishOnly runs the full verify pipeline first), pushes the v* tag,
# creates the GitHub Release with generated notes, and commits the version
# bump back to main as "chore(release): v<version> [skip ci]".
# workflow_dispatch exists to re-run a failed release; semantic-release is
# deterministic per commit range, so a re-run never double-publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release commit, v* tag, GitHub Release
  id-token: write # npm provenance attestation

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'almamun2b/query-builder-prisma'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags — required for commit analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Release commit attribution follows the repo owner (see AGENTS.md);
          # never Claude or harness defaults.
          GIT_AUTHOR_NAME: almamun2b
          GIT_AUTHOR_EMAIL: almamun2b@gmail.com
          GIT_COMMITTER_NAME: almamun2b
          GIT_COMMITTER_EMAIL: almamun2b@gmail.com
        run: npx semantic-release
